<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Real Estate Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <h1>🏠 Real Estate Platform</h1>
        <div class="nav-links">
            <a href="user-dashboard.html">Dashboard</a>
            <a href="index.html">Properties</a>
            <a href="add-property.html">Add Property</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2>Welcome to Your Dashboard</h2>
            <p id="userInfo">Loading user info...</p>
        </div>

        <div style="text-align: right; margin-bottom: 20px;">
            <a href="add-property.html" class="btn" style="width: auto; display: inline-block; padding: 10px 20px;">+ Add New Property</a>
        </div>

        <!-- My Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalProperties">0</h3>
                <p>My Properties</p>
            </div>
            <div class="stat-card">
                <h3 id="totalFavorites">0</h3>
                <p>My Favorites</p>
            </div>
            <div class="stat-card">
                <h3 id="totalInquiries">0</h3>
                <p>Inquiries Sent</p>
            </div>
        </div>

        <!-- My Properties -->
        <div style="margin-top: 40px;">
            <h2>🏠 My Properties</h2>
            <div id="myPropertiesContainer" class="properties-grid">
                <p>Loading your properties...</p>
            </div>
        </div>

        <!-- My Favorites -->
        <div style="margin-top: 40px;">
            <h2>❤️ My Favorites</h2>
            <div id="myFavoritesContainer" class="properties-grid">
                <p>Loading your favorites...</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if user is logged in and NOT admin
        if (!requireAuth()) {
            // Redirect handled
        } else if (getUserRole() === 'admin') {
            alert('Admins should use the admin dashboard!');
            window.location.href = 'admin-dashboard.html';
        }

        // Load user dashboard data
        async function loadUserDashboard() {
            try {
                // Get user info
                const userResponse = await fetch(`${API_CONFIG.BASE_URL}/users/me`, {
                    headers: getAuthHeaders()
                });
                
                if (userResponse.ok) {
                    const user = await userResponse.json();
                    document.getElementById('userInfo').textContent = 
                        `Logged in as: ${user.name} (${user.email})`;
                }

                // Get all properties and filter for user's own
                const propsResponse = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.endpoints.properties}`, {
                    headers: getAuthHeaders()
                });
                
                if (propsResponse.ok) {
                    const allProperties = await propsResponse.json();
                    // Filter to show only properties owned by this user
                    const myProperties = allProperties.filter(p => p.owner_id === parseInt(localStorage.getItem('userId') || '0'));
                    
                    document.getElementById('totalProperties').textContent = myProperties.length;
                    
                    const container = document.getElementById('myPropertiesContainer');
                    if (myProperties.length === 0) {
                        container.innerHTML = '<p>You haven\'t listed any properties yet. <a href="add-property.html">Add your first property!</a></p>';
                    } else {
                        container.innerHTML = myProperties.map(property => `
                            <div class="property-card">
                                <div class="property-info">
                                    <h3>${property.title}</h3>
                                    <div class="property-price">$${property.price.toLocaleString()}</div>
                                    <div class="property-details">
                                        <p>📍 ${property.city}, ${property.state}</p>
                                        <p>Status: ${property.status}</p>
                                    </div>
                                    <button onclick="deleteMyProperty(${property.id})" class="btn btn-danger" style="margin-top: 10px;">Delete</button>
                                </div>
                            </div>
                        `).join('');
                    }
                }

                // Get favorites
                const favResponse = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.endpoints.favorites}`, {
                    headers: getAuthHeaders()
                });
                
                if (favResponse.ok) {
                    const favorites = await favResponse.json();
                    document.getElementById('totalFavorites').textContent = favorites.length;
                    
                    const favContainer = document.getElementById('myFavoritesContainer');
                    if (favorites.length === 0) {
                        favContainer.innerHTML = '<p>You haven\'t saved any properties yet.</p>';
                    } else {
                        favContainer.innerHTML = favorites.map(property => `
                            <div class="property-card">
                                <div class="property-info">
                                    <h3>${property.title}</h3>
                                    <div class="property-price">$${property.price.toLocaleString()}</div>
                                    <div class="property-details">
                                        <p>📍 ${property.city}, ${property.state}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    }
                }

                // Get sent inquiries
                const inquiriesResponse = await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.endpoints.inquiries}/sent`, {
                    headers: getAuthHeaders()
                });
                
                if (inquiriesResponse.ok) {
                    const inquiries = await inquiriesResponse.json();
                    document.getElementById('totalInquiries').textContent = inquiries.length;
                }

            } catch (error) {
                console.error('Error loading user dashboard:', error);
            }
        }

        // Delete my property function
        async function deleteMyProperty(propertyId) {
            if (!confirm('Are you sure you want to delete this property?')) return;
            
            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/properties/${propertyId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    alert('Property deleted successfully!');
                    loadUserDashboard();
                } else {
                    const data = await response.json();
                    alert(data.detail || 'Failed to delete property');
                }
            } catch (error) {
                console.error('Delete property error:', error);
            }
        }

        // Initialize dashboard
        loadUserDashboard();
    </script>
</body>
</html>
